name: Production Deployment (Direct to Pages)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allowing one deployment at a time to prevent race conditions
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Production Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JS Target
        run: ./gradlew jsBrowserDistribution --no-daemon

      # Consolidate build files into a single distribution folder
      - name: Prepare Pages Artifact
        run: |
          mkdir -p dist
          cp -r onegul/build/dist/js/productionExecutable/* dist/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4